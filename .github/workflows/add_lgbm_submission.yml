name: Add LightGBM submission cell

on:
  push:
    branches:
      - add-lightgbm-experiment

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch notebook
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('Formative1Part2_Classification.ipynb')
          nb = json.loads(path.read_text(encoding='utf-8'))

          section_idx = None
          for i, cell in enumerate(nb['cells']):
              if cell.get('cell_type') == 'markdown' and any('## 9. Generating a Submission' in s for s in cell.get('source', [])):
                  section_idx = i
                  break
          if section_idx is None:
              raise SystemExit('Submission section not found')

          code_idx = None
          for i in range(section_idx + 1, len(nb['cells'])):
              if nb['cells'][i].get('cell_type') == 'code':
                  code_idx = i
                  break
          if code_idx is None:
              raise SystemExit('Submission code cell not found')

          if any('submission_lgb_complex.csv' in ''.join(c.get('source', [])) for c in nb['cells']):
              print('LightGBM submission already present')
          else:
              nb['cells'][section_idx]['source'] = [
                  '## 9. Generating Submissions\\n',
                  'The strongest XGBoost and LightGBM configurations are both refit on all available labelled training data. Two separate Kaggle submission files are generated so the final candidates can be compared on the competition leaderboard. The submissions contain the original test identifiers and the probability of class 1 because ROC-AUC requires probability scores.\\n'
              ]

              new_md = {
                  'cell_type': 'markdown',
                  'metadata': {},
                  'source': [
                      '### Second submission: LightGBM\\n',
                      'The `lgb-complex` configuration is the second final candidate. It uses 600 boosting rounds and 63 leaves, with subsampling, feature subsampling, and L2 regularization. This creates a different model family from the XGBoost submission while keeping the same preprocessing and feature set.\\n'
                  ],
                  'id': 'lgbm_submission_md'
              }

              new_code = {
                  'cell_type': 'code',
                  'execution_count': None,
                  'metadata': {},
                  'outputs': [],
                  'source': [
                      "final_lgbm = boosted_pipeline(LGBMClassifier(\\n",
                      "    n_estimators=600,\\n",
                      "    num_leaves=63,\\n",
                      "    learning_rate=0.04,\\n",
                      "    subsample=0.85,\\n",
                      "    colsample_bytree=0.85,\\n",
                      "    reg_lambda=3,\\n",
                      "    min_child_samples=30,\\n",
                      "    objective='binary',\\n",
                      "    random_state=RANDOM_STATE,\\n",
                      "    n_jobs=-1,\\n",
                      "    verbosity=-1\\n",
                      "))\\n",
                      "\\n",
                      "final_lgbm.fit(X, y)\\n",
                      "test_probs_lgbm = final_lgbm.predict_proba(X_test)[:, 1]\\n",
                      "submission_lgbm = pd.DataFrame({'id': test['id'], 'target': test_probs_lgbm})\\n",
                      "assert len(submission_lgbm) == len(test) and submission_lgbm['target'].between(0, 1).all()\\n",
                      "submission_lgbm.to_csv('submission_lgb_complex.csv', index=False)\\n",
                      "print(submission_lgbm.head())\\n",
                      "print('Saved submission_lgb_complex.csv with', len(submission_lgbm), 'rows.')\\n"
                  ],
                  'id': 'lgbm_submission_code'
              }

              nb['cells'][code_idx + 1:code_idx + 1] = [new_md, new_code]
              path.write_text(json.dumps(nb, indent=1, ensure_ascii=False), encoding='utf-8')
              print('Patched notebook with LightGBM submission cell')
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/add_lgbm_submission.yml
          git add Formative1Part2_Classification.ipynb .github/workflows/add_lgbm_submission.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add LightGBM Kaggle submission"
            git push
          fi
